<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>微信聊天梗图生成器 | 植人大树工具集</title>
    <!--
    * 作者：植人大树
    * 个人主页：https://link3.cc/zhirendashu
    * 版本: v1.0.0
    * 发布日期: 2026-07-16
    * 开源协议: CC BY-NC-SA 4.0
    * 舔狗模拟器 & 微信聊天截图生成器
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Noto+Sans+SC:wght@300;400;700&display=swap" rel="stylesheet">
    <!-- Cropper.js CSS & JS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.js"></script>
    <!-- html-to-image -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html-to-image/1.11.11/html-to-image.min.js"></script>
    
    <style>
        /* ==================== 核心设计系统 ==================== */
        :root {
            --bg-dark: #05070a;
            --surface-glass: rgba(22, 26, 36, 0.72);
            --border-glass: rgba(255, 255, 255, 0.09);
            --accent-sky: #0ea5e9;
            --accent-primary: #6366f1;
            --accent-green: #10b981;
            --accent-amber: #f59e0b;
            --accent-rose: #f43f5e;
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --font: 'Outfit', 'Noto Sans SC', sans-serif;
            --ease: all 0.32s cubic-bezier(0.23, 1, 0.32, 1);
            --radius-lg: 16px;
            --radius-md: 10px;
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: var(--font);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            position: relative;
        }

        /* 胶片颗粒噪声滤镜 */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.025'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 9999;
        }

        /* 背景流光光斑 */
        .bg-blobs {
            position: fixed;
            inset: 0;
            z-index: -1;
            overflow: hidden;
            filter: blur(90px);
            opacity: 0.35;
            pointer-events: none;
        }
        .blob {
            position: absolute;
            border-radius: 50%;
            animation: bmv 28s infinite alternate;
        }
        .blob-1 {
            width: 50vw;
            height: 50vw;
            background: radial-gradient(circle, #6366f1, transparent 70%);
            top: -15%;
            right: -10%;
        }
        .blob-2 {
            width: 40vw;
            height: 40vw;
            background: radial-gradient(circle, #0ea5e9, transparent 70%);
            bottom: -10%;
            left: -10%;
            animation-delay: -11s;
        }

        @keyframes bmv {
            from { transform: translate(0, 0) scale(1); }
            to { transform: translate(55px, 38px) scale(1.15); }
        }

        /* 顶部导航栏 */
        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 24px;
            border-bottom: 1px solid var(--border-glass);
            background: rgba(5, 7, 10, 0.65);
            backdrop-filter: blur(16px);
            position: sticky;
            top: 0;
            z-index: 100;
            flex-shrink: 0;
        }
        .topbar-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .back-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--text-dim);
            text-decoration: none;
            font-size: 0.84rem;
            font-weight: 500;
            padding: 6px 14px;
            border-radius: 100px;
            border: 1px solid var(--border-glass);
            background: rgba(255, 255, 255, 0.04);
            transition: var(--ease);
        }
        .back-btn:hover {
            color: var(--text-main);
            border-color: rgba(255, 255, 255, 0.18);
            background: rgba(255, 255, 255, 0.08);
        }
        .tool-title {
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: -0.3px;
        }
        .badge-pill {
            font-size: 0.68rem;
            font-weight: 700;
            padding: 3px 10px;
            border-radius: 100px;
            background: rgba(14, 165, 233, 0.15);
            border: 1px solid rgba(14, 165, 233, 0.3);
            color: var(--accent-sky);
        }
        .export-btn {
            display: flex;
            align-items: center;
            gap: 7px;
            padding: 9px 22px;
            border-radius: 100px;
            background: linear-gradient(135deg, var(--accent-sky), var(--accent-primary));
            color: #fff;
            font-size: 0.88rem;
            font-weight: 700;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 18px rgba(14, 165, 233, 0.38);
            transition: var(--ease);
        }
        .export-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 28px rgba(14, 165, 233, 0.55);
        }
        .export-btn:active {
            transform: scale(0.97);
        }

        /* 主体布局 */
        .workspace {
            flex: 1;
            display: flex;
            max-width: 1400px;
            width: 100%;
            margin: 0 auto;
            padding: 24px;
            gap: 28px;
            min-height: 0;
            box-sizing: border-box;
        }
        @media (max-width: 1024px) {
            .workspace {
                flex-direction: column;
                height: auto;
                overflow: visible;
            }
        }

        /* ===== 左侧编辑控制台 ===== */
        .sidebar {
            flex: 1.2;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 22px;
            background: var(--surface-glass);
            border: 1px solid var(--border-glass);
            border-radius: 24px;
            padding: 24px;
            overflow-y: auto;
            max-height: calc(100vh - 120px);
            backdrop-filter: blur(12px);
        }
        @media (max-width: 1024px) {
            .sidebar {
                max-height: none;
                overflow: visible;
            }
        }
        .sidebar::-webkit-scrollbar {
            width: 6px;
        }
        .sidebar::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }

        .section-box {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .section-title {
            font-size: 0.72rem;
            font-weight: 800;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--text-dim);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .section-title::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border-glass);
        }

        /* 选项组 / 卡片表单 */
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        @media (max-width: 600px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .form-group.full-width {
            grid-column: 1 / -1;
        }
        .form-label {
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--text-dim);
        }
        .form-input {
            width: 100%;
            background: rgba(0, 0, 0, 0.3);
            border: 1.5px solid var(--border-glass);
            border-radius: var(--radius-md);
            padding: 10px 14px;
            font-size: 0.85rem;
            color: var(--text-main);
            font-family: inherit;
            outline: none;
            transition: var(--ease);
        }
        .form-input:focus {
            border-color: var(--accent-sky);
            background: rgba(0, 0, 0, 0.45);
            box-shadow: 0 0 10px rgba(14, 165, 233, 0.15);
        }

        /* 头像上传区域 */
        .avatar-uploader-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .avatar-card {
            background: rgba(0, 0, 0, 0.2);
            border: 1px dashed var(--border-glass);
            border-radius: var(--radius-lg);
            padding: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: var(--ease);
            position: relative;
        }
        .avatar-card:hover {
            border-color: var(--accent-sky);
            background: rgba(14, 165, 233, 0.04);
        }
        .avatar-preview-wrapper {
            width: 48px;
            height: 48px;
            border-radius: 8px;
            overflow: hidden;
            background: #222;
            flex-shrink: 0;
        }
        .avatar-preview-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .avatar-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .avatar-info-title {
            font-size: 0.82rem;
            font-weight: 700;
        }
        .avatar-info-sub {
            font-size: 0.68rem;
            color: var(--text-dim);
        }

        /* 模板快捷选择 */
        .template-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
            gap: 8px;
        }
        .template-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-md);
            padding: 10px 8px;
            font-size: 0.76rem;
            font-weight: 700;
            color: var(--text-main);
            cursor: pointer;
            text-align: center;
            transition: var(--ease);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }
        .template-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.18);
            transform: translateY(-1px);
        }
        .template-btn.active {
            background: rgba(99, 102, 241, 0.15);
            border-color: var(--accent-primary);
            box-shadow: 0 0 10px rgba(99, 102, 241, 0.25);
        }

        /* 对话框/消息管理器 */
        .message-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 280px;
            overflow-y: auto;
            padding-right: 4px;
            margin-bottom: 12px;
        }
        .message-list::-webkit-scrollbar {
            width: 4px;
        }
        .message-list::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.06);
            border-radius: 4px;
        }
        .message-item {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-md);
            padding: 10px 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            animation: fadeIn 0.25s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .msg-side-toggle {
            font-size: 0.72rem;
            font-weight: 700;
            padding: 4px 8px;
            border-radius: 6px;
            cursor: pointer;
            border: none;
            transition: var(--ease);
            flex-shrink: 0;
        }
        .msg-side-toggle.me {
            background: rgba(16, 185, 129, 0.15);
            color: var(--accent-green);
        }
        .msg-side-toggle.other {
            background: rgba(148, 163, 184, 0.15);
            color: var(--text-dim);
        }
        .msg-input-inline {
            flex: 1;
            background: transparent;
            border: none;
            border-bottom: 1px dashed rgba(255, 255, 255, 0.15);
            color: var(--text-main);
            font-size: 0.82rem;
            outline: none;
            padding: 2px 4px;
            font-family: inherit;
        }
        .msg-input-inline:focus {
            border-bottom-color: var(--accent-sky);
        }
        .msg-action-btn {
            background: transparent;
            border: none;
            color: var(--text-dim);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4px;
            border-radius: 4px;
            transition: var(--ease);
        }
        .msg-action-btn:hover {
            color: var(--accent-rose);
            background: rgba(244, 63, 94, 0.1);
        }
        .msg-action-btn.fail-btn {
            color: var(--text-dim);
        }
        .msg-action-btn.fail-btn.active {
            color: var(--accent-rose);
        }
        .msg-action-btn.fail-btn.active:hover {
            color: var(--text-dim);
        }

        /* 添加消息面板 */
        .add-message-panel {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-lg);
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .add-msg-controls {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }
        .sender-select-btn {
            display: flex;
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-glass);
            overflow: hidden;
        }
        .sender-select-btn button {
            background: transparent;
            border: none;
            padding: 6px 12px;
            font-size: 0.76rem;
            font-weight: 700;
            color: var(--text-dim);
            cursor: pointer;
            transition: var(--ease);
        }
        .sender-select-btn button.active {
            background: var(--accent-primary);
            color: #fff;
        }
        .add-msg-btn {
            background: var(--accent-sky);
            color: #fff;
            font-weight: 700;
            border: none;
            padding: 6px 16px;
            border-radius: 8px;
            font-size: 0.78rem;
            cursor: pointer;
            transition: var(--ease);
        }
        .add-msg-btn:hover {
            opacity: 0.9;
        }

        /* 简易表情板 */
        .emoji-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            padding: 4px 0;
        }
        .emoji-item {
            font-size: 1.1rem;
            cursor: pointer;
            padding: 2px 4px;
            border-radius: 4px;
            transition: var(--ease);
            user-select: none;
        }
        .emoji-item:hover {
            background: rgba(255,255,255,0.08);
            transform: scale(1.15);
        }

        /* 系统消息设置 */
        .system-msg-box {
            background: rgba(0, 0, 0, 0.15);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-lg);
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .switch-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .switch-label {
            font-size: 0.8rem;
            font-weight: 700;
        }
        /* Toggle 开关 */
        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 38px;
            height: 20px;
        }
        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        .slider {
            position: absolute;
            cursor: pointer;
            inset: 0;
            background-color: rgba(255,255,255,0.15);
            transition: .3s;
            border-radius: 34px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 14px;
            width: 14px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }
        input:checked + .slider {
            background-color: var(--accent-sky);
        }
        input:checked + .slider:before {
            transform: translateX(18px);
        }

        /* ===== 右侧预览面板 ===== */
        .preview-panel {
            flex: 0.95;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            min-width: 0;
        }
        @media (max-width: 1024px) {
            .preview-panel {
                padding: 12px 0;
            }
        }

        /* 手机框套壳 */
        .phone-wrapper {
            width: 390px;
            height: 780px;
            border-radius: 40px;
            border: 10px solid #1a1e28;
            box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.8),
                        0 0 0 1px rgba(255, 255, 255, 0.05);
            background: #111;
            position: relative;
            overflow: hidden;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
        }
        @media (max-width: 480px) {
            .phone-wrapper {
                width: 100%;
                max-width: 360px;
                height: 720px;
            }
        }

        /* 手机内部屏幕 (这才是导出的主体) */
        .phone-screen, .phone-screen * {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "PingFang SC", "Helvetica Neue", Arial, sans-serif;
        }
        .phone-screen {
            width: 100%;
            height: 100%;
            background-color: #111111;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
            color: #dfdfdf;
        }

        /* 1. 微信状态栏 */
        .status-bar {
            height: 44px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 24px 0 28px;
            background-color: #191919;
            font-size: 0.72rem;
            font-weight: 600;
            color: #ffffff;
            user-select: none;
            flex-shrink: 0;
            z-index: 10;
        }
        .status-bar-right {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .status-bar svg {
            display: block;
        }

        /* 2. 微信标题栏 */
        .wx-header {
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            background-color: #191919;
            border-bottom: 0.5px solid #1a1a1a;
            position: relative;
            flex-shrink: 0;
            z-index: 10;
        }
        .wx-back-icon {
            display: flex;
            align-items: center;
            cursor: pointer;
            color: #ffffff;
        }
        .wx-title {
            font-size: 1.02rem;
            font-weight: 500;
            color: #ffffff;
            max-width: 200px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .wx-more-icon {
            color: #ffffff;
            cursor: pointer;
        }

        /* 3. 聊天滚动区 */
        .chat-body {
            flex: 1;
            overflow-y: auto;
            padding: 16px 12px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            background-color: #111111;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }
        .chat-body::-webkit-scrollbar {
            display: none;
        }

        /* 微信日期块 */
        .time-badge {
            align-self: center;
            background-color: rgba(255, 255, 255, 0.05);
            color: #8c8c8c;
            font-size: 0.72rem;
            padding: 3px 8px;
            border-radius: 4px;
            user-select: none;
        }

        /* 微信消息气泡样式 */
        .msg-row {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            max-width: 78%;
        }
        .msg-row.me {
            align-self: flex-end;
            flex-direction: row-reverse;
        }
        .msg-row.other {
            align-self: flex-start;
        }

        .wx-avatar {
            width: 40px;
            height: 40px;
            border-radius: 4px;
            background: #2c2c2c;
            overflow: hidden;
            flex-shrink: 0;
        }
        .wx-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .bubble-wrap {
            display: flex;
            align-items: center;
            gap: 8px;
            position: relative;
        }
        .msg-row.me .bubble-wrap {
            flex-direction: row-reverse;
        }

        .wx-bubble {
            padding: 10px 12px;
            border-radius: 4px;
            font-size: 16px;
            line-height: 1.4;
            word-break: break-all;
            white-space: pre-wrap;
            position: relative;
        }

        /* 对方气泡（灰色） */
        .msg-row.other .wx-bubble {
            background-color: #2c2c2c;
            color: #f5f5f5;
        }
        .msg-row.other .wx-bubble::after {
            content: '';
            position: absolute;
            top: 14px;
            left: -5px;
            width: 0;
            height: 0;
            border-top: 5px solid transparent;
            border-bottom: 5px solid transparent;
            border-right: 5px solid #2c2c2c;
        }

        /* 我的气泡（微信绿） */
        .msg-row.me .wx-bubble {
            background-color: #10a058;
            color: #000000;
            font-weight: 400;
        }
        .msg-row.me .wx-bubble::after {
            content: '';
            position: absolute;
            top: 14px;
            right: -5px;
            width: 0;
            height: 0;
            border-top: 5px solid transparent;
            border-bottom: 5px solid transparent;
            border-left: 5px solid #10a058;
        }

        /* 红色惊叹号 */
        .fail-exclamation {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background-color: #fa5151;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: 800;
            user-select: none;
            flex-shrink: 0;
        }

        /* 4. 系统通知卡片 */
        .sys-message-card {
            align-self: center;
            text-align: center;
            max-width: 90%;

        const previewNickname = document.getElementById('wx-preview-nickname');
        const previewTime = document.getElementById('wx-preview-time');
        const messagesContainer = document.getElementById('wx-messages-container');
        const systemCard = document.getElementById('wx-system-card');
        const systemMsgToggle = document.getElementById('system-msg-toggle');
        const systemMsgContent = document.getElementById('system-msg-content');
        const systemTextGroup = document.getElementById('system-text-group');
        
        const previewAvatarMe = document.getElementById('preview-avatar-me');
        const previewAvatarOther = document.getElementById('preview-avatar-other');
        const fileAvatarMe = document.getElementById('file-avatar-me');
        const fileAvatarOther = document.getElementById('file-avatar-other');
        
        const messageListContainer = document.getElementById('message-list-container');
        const newMsgText = document.getElementById('new-msg-text');
        const addMsgBtn = document.getElementById('add-msg-btn');
        const emojiItems = document.querySelectorAll('.emoji-item');
        
        const fileChatBg = document.getElementById('file-chat-bg');
        const chatBody = document.getElementById('wx-chat-body');
        const clearBgBtn = document.getElementById('clear-bg-btn');

        const cropModal = document.getElementById('crop-modal');
        const cropImageElement = document.getElementById('crop-image-element');
        const cropCancelBtn = document.getElementById('crop-cancel-btn');
        const cropConfirmBtn = document.getElementById('crop-confirm-btn');

        const saveImageBtn = document.getElementById('save-image-btn');
        const wxScreenshotTarget = document.getElementById('wx-screenshot-target');

        // ==================== 状态同步渲染 ====================
        function renderAll() {
            previewNickname.textContent = inputNickname.value || '微信好友';
            previewTime.textContent = inputTime.value || '昨天 22:35';
            
            updateStatusBarTime();

            previewAvatarMe.src = avatarMe;
            previewAvatarOther.src = avatarOther;

            if (systemMsgToggle.checked) {
                systemCard.style.display = 'block';
                let rawText = systemMsgContent.value || '';
                let htmlText = rawText.replace(/\[([^\]]+)\]/g, '<a>$1</a>');
                systemCard.innerHTML = htmlText;
            } else {
                systemCard.style.display = 'none';
            }

            messagesContainer.innerHTML = '';
            messages.forEach((msg, idx) => {
                const row = document.createElement('div');
                row.className = `msg-row ${msg.sender}`;
                
                const av = document.createElement('div');
                av.className = 'wx-avatar';
                const avImg = document.createElement('img');
                avImg.src = msg.sender === 'me' ? avatarMe : avatarOther;
                av.appendChild(avImg);
                row.appendChild(av);

                const bubbleWrap = document.createElement('div');
                bubbleWrap.className = 'bubble-wrap';

                const bubble = document.createElement('div');
                bubble.className = 'wx-bubble';
                bubble.textContent = msg.text;
                bubbleWrap.appendChild(bubble);

                if (msg.sender === 'me' && msg.showFail) {
                    const exclamation = document.createElement('div');
                    exclamation.className = 'fail-exclamation';
                    exclamation.textContent = '!';
                    bubbleWrap.appendChild(exclamation);
                }

                row.appendChild(bubbleWrap);
                messagesContainer.appendChild(row);
            });

            renderMessageListManager();
        }

        function updateStatusBarTime() {
            const chatTime = inputTime.value || '';
            const timeReg = /(\d{1,2})[:：](\d{2})/;
            const match = chatTime.match(timeReg);
            if (match) {
                document.getElementById('status-bar-time').textContent = `${match[1]}:${match[2]}`;
            } else {
                const now = new Date();
                const hh = String(now.getHours()).padStart(2, '0');
                const mm = String(now.getMinutes()).padStart(2, '0');
                document.getElementById('status-bar-time').textContent = `${hh}:${mm}`;
            }
        }

        function renderMessageListManager() {
            messageListContainer.innerHTML = '';
            
            if (messages.length === 0) {
                messageListContainer.innerHTML = `<div style="text-align:center; padding: 20px; font-size: 0.76rem; color: var(--text-dim);">暂无对话，请在下方插入新消息</div>`;
                return;
            }

            messages.forEach((msg, idx) => {
                const item = document.createElement('div');
                item.className = 'message-item';
                
                const toggleBtn = document.createElement('button');
                toggleBtn.className = `msg-side-toggle ${msg.sender}`;
                toggleBtn.textContent = msg.sender === 'me' ? '我发送' : '对方发';
                toggleBtn.addEventListener('click', () => {
                    msg.sender = msg.sender === 'me' ? 'other' : 'me';
                    if (msg.sender === 'other') msg.showFail = false;
                    renderAll();
                });
                item.appendChild(toggleBtn);

                const txtInput = document.createElement('input');
                txtInput.type = 'text';
                txtInput.className = 'msg-input-inline';
                txtInput.value = msg.text;
                txtInput.addEventListener('input', (e) => {
                    msg.text = e.target.value;
                    const previewBubbles = messagesContainer.querySelectorAll('.wx-bubble');
                    if (previewBubbles[idx]) {
                        previewBubbles[idx].textContent = msg.text;
                    }
                });
                item.appendChild(txtInput);

                if (msg.sender === 'me') {
                    const failBtn = document.createElement('button');
                    failBtn.className = `msg-action-btn fail-btn ${msg.showFail ? 'active' : ''}`;
                    failBtn.title = msg.showFail ? '关闭发送失败' : '设置发送失败(感叹号)';
                    failBtn.innerHTML = `
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="${msg.showFail ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="10"></circle>
                            <line x1="12" y1="8" x2="12" y2="12"></line>
                            <line x1="12" y1="16" x2="12.01" y2="16"></line>
                        </svg>
                    `;
                    failBtn.addEventListener('click', () => {
                        msg.showFail = !msg.showFail;
                        renderAll();
                    });
                    item.appendChild(failBtn);
                }

                const upBtn = document.createElement('button');
                upBtn.className = 'msg-action-btn';
                upBtn.innerHTML = `<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="18 15 12 9 6 15"></polyline></svg>`;
                upBtn.style.color = idx === 0 ? 'rgba(255,255,255,0.05)' : 'var(--text-dim)';
                upBtn.disabled = idx === 0;
                upBtn.addEventListener('click', () => {
                    if (idx > 0) {
                        const temp = messages[idx];
                        messages[idx] = messages[idx - 1];
                        messages[idx - 1] = temp;
                        renderAll();
                    }
                });
                item.appendChild(upBtn);

                const downBtn = document.createElement('button');
                downBtn.className = 'msg-action-btn';
                downBtn.innerHTML = `<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"></polyline></svg>`;
                downBtn.style.color = idx === messages.length - 1 ? 'rgba(255,255,255,0.05)' : 'var(--text-dim)';
                downBtn.disabled = idx === messages.length - 1;
                downBtn.addEventListener('click', () => {
                    if (idx < messages.length - 1) {
                        const temp = messages[idx];
                        messages[idx] = messages[idx + 1];
                        messages[idx + 1] = temp;
                        renderAll();
                    }
                });
                item.appendChild(downBtn);

                const delBtn = document.createElement('button');
                delBtn.className = 'msg-action-btn';
                delBtn.innerHTML = `<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>`;
                delBtn.addEventListener('click', () => {
                    messages.splice(idx, 1);
                    renderAll();
                });
                item.appendChild(delBtn);

                messageListContainer.appendChild(item);
            });
        }

        // ==================== 事件监听 ====================
        inputNickname.addEventListener('input', renderAll);
        inputTime.addEventListener('input', renderAll);

        systemMsgToggle.addEventListener('change', () => {
            systemTextGroup.style.display = systemMsgToggle.checked ? 'flex' : 'none';
            renderAll();
        });
        systemMsgContent.addEventListener('input', renderAll);

        const templateButtons = document.querySelectorAll('.template-btn');
        templateButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                templateButtons.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                
                const tName = btn.getAttribute('data-template');
                const tData = TEMPLATES[tName];
                if (tData) {
                    inputNickname.value = tData.nickname;
                    inputTime.value = tData.time;
                    systemMsgToggle.checked = tData.showSystem;
                    systemMsgContent.value = tData.systemMessage;
                    systemTextGroup.style.display = tData.showSystem ? 'flex' : 'none';
                    messages = JSON.parse(JSON.stringify(tData.messages));
                    renderAll();
                }
            });
        });

        const newMsgSenderGroup = document.getElementById('new-msg-sender-group');
        let newMsgSender = 'me';
        newMsgSenderGroup.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('click', () => {
                newMsgSenderGroup.querySelectorAll('button').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                newMsgSender = btn.getAttribute('data-sender');
            });
        });

        function handleAddMsg() {
            const txt = newMsgText.value.trim();
            if (!txt) return;
            messages.push({
                sender: newMsgSender,
                text: txt,
                showFail: false
            });
            newMsgText.value = '';
            renderAll();
            setTimeout(() => {
                chatBody.scrollTop = chatBody.scrollHeight;
            }, 100);
        }

        addMsgBtn.addEventListener('click', handleAddMsg);
        newMsgText.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                handleAddMsg();
            }
        });

        emojiItems.forEach(item => {
            item.addEventListener('click', () => {
                const em = item.textContent;
                const pos = newMsgText.selectionStart;
                const txt = newMsgText.value;
                newMsgText.value = txt.slice(0, pos) + em + txt.slice(pos);
                newMsgText.focus();
                newMsgText.selectionStart = newMsgText.selectionEnd = pos + em.length;
            });
        });

        const uploadMyAvatar = document.getElementById('upload-my-avatar');
        const uploadOtherAvatar = document.getElementById('upload-other-avatar');

        uploadMyAvatar.addEventListener('click', () => {
            currentAvatarTarget = 'me';
            fileAvatarMe.click();
        });
        uploadOtherAvatar.addEventListener('click', () => {
            currentAvatarTarget = 'other';
            fileAvatarOther.click();
        });

        function handleAvatarFileSelect(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(evt) {
                cropImageElement.src = evt.target.result;
                cropModal.style.display = 'flex';
                
                if (cropper) {
                    cropper.destroy();
                }
                setTimeout(() => {
                    cropper = new Cropper(cropImageElement, {
                        aspectRatio: 1,
                        viewMode: 1,
                        background: false,
                        modal: true,
                        guides: true,
                        highlight: false,
                        cropBoxMovable: true,
                        cropBoxResizable: true
                    });
                }, 50);
            };
            reader.readAsDataURL(file);
        }

        fileAvatarMe.addEventListener('change', handleAvatarFileSelect);
        fileAvatarOther.addEventListener('change', handleAvatarFileSelect);

        cropCancelBtn.addEventListener('click', () => {
            cropModal.style.display = 'none';
            if (cropper) {
                cropper.destroy();
                cropper = null;
            }
            fileAvatarMe.value = '';
            fileAvatarOther.value = '';
        });

        cropConfirmBtn.addEventListener('click', () => {
            if (!cropper) return;
            const canvas = cropper.getCroppedCanvas({
                width: 160,
                height: 160
            });
            const croppedUrl = canvas.toDataURL('image/jpeg', 0.9);
            
            if (currentAvatarTarget === 'me') {
                avatarMe = croppedUrl;
            } else {
                avatarOther = croppedUrl;
            }
            
            cropModal.style.display = 'none';
            cropper.destroy();
            cropper = null;
            fileAvatarMe.value = '';
            fileAvatarOther.value = '';
            renderAll();
        });

        fileChatBg.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(evt) {
                chatBody.style.backgroundImage = `url(${evt.target.result})`;
                clearBgBtn.style.display = 'inline';
            };
            reader.readAsDataURL(file);
        });

        clearBgBtn.addEventListener('click', () => {
            chatBody.style.backgroundImage = 'none';
            fileChatBg.value = '';
            clearBgBtn.style.display = 'none';
        });

        saveImageBtn.addEventListener('click', () => {
            saveImageBtn.disabled = true;
            saveImageBtn.textContent = '生成中...';

            const options = {
                pixelRatio: 2,
                style: {
                    transform: 'scale(1)',
                    borderRadius: '0'
                }
            };

            updateStatusBarTime();

            const originalOverflow = chatBody.style.overflowY;
            chatBody.style.overflowY = 'hidden';

            htmlToImage.toPng(wxScreenshotTarget, options)
                .then(function (dataUrl) {
                    const link = document.createElement('a');
                    const nickName = inputNickname.value || '微信';
                    link.download = `微信聊天梗图_${nickName}.png`;
                    link.href = dataUrl;
                    link.click();

                    saveImageBtn.disabled = false;
                    saveImageBtn.textContent = '保存高清图片';
                    chatBody.style.overflowY = originalOverflow;
                })
                .catch(function (error) {
                    console.error('oops, something went wrong!', error);
                    alert('截图生成失败，请重试！');
                    saveImageBtn.disabled = false;
                    saveImageBtn.textContent = '保存高清图片';
                    chatBody.style.overflowY = originalOverflow;
                });
        });

        // ==================== 初始化 ====================
        window.addEventListener('DOMContentLoaded', () => {
            const tData = TEMPLATES.tiangou;
            inputNickname.value = tData.nickname;
            inputTime.value = tData.time;
            systemMsgToggle.checked = tData.showSystem;
            systemMsgContent.value = tData.systemMessage;
            systemTextGroup.style.display = tData.showSystem ? 'flex' : 'none';
            
            avatarMe = DEFAULT_AVATARS.me;
            avatarOther = DEFAULT_AVATARS.other;

            renderAll();
        });
    </script>
</body>
</html>
